# Dependency updates as pull requests into dev, where CI tests them like any other
# change before they reach main. Weekly; npm's minor and patch updates in one pull
# request, a major one in its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev

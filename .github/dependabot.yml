# Dependency updates as pull requests into dev, where CI tests them like any other
# change before they reach main. Weekly; npm's minor and patch updates in one pull
# request, a major one in its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native port) ships no JavaScript compiler API, which
      # scripts/affected-tests.mjs imports; move to it by hand once that is reworked.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's types follow the runtime, pinned to 24.x in package.json's engines.
      - dependency-name: '@types/node'
        versions: ['>=25']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev

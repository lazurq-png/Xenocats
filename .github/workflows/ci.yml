name: CI

# Each change is tested once, before it is merged: on a pull request into Nightrun,
# dev or main, and on a push to Nightrun (an unattended run fast-forwards each
# finished task onto it and pushes it, then polls) or to dev (supervised work).
# Merging into main runs nothing: its pull request was tested, and the merge only
# deploys (Vercel's own Git integration, vercel.json). A task branch's own push
# runs nothing either: it was checked locally first. A pull request from dev into
# main whose merge holds exactly the files of a commit CI already passed on dev
# skips the tests (the `tested` job); any other pull request into main runs them all.
on:
  push:
    branches: [Nightrun, dev]
  pull_request:
    branches: [Nightrun, dev, main]

permissions:
  contents: read
# Every checkout leaves no token behind in .git/config (persist-credentials: false):
# no step pushes or fetches, and the steps after it run code from npm and the change.

# A newer push to the same branch, or to the same pull request, cancels the run it
# supersedes: only the newest commit's result is wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Says whether this run would repeat one that passed: a pull request from dev
  # into main where main changes no file since it last took dev (its own commits
  # are only the merges of earlier releases, so the merge holds dev's tip as it
  # is) and CI passed on the push of that very commit to dev. Anything else, a
  # dev run still going or failed included, runs the tests.
  tested:
    name: Already tested on dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # An error here (the API, say) leaves skip unset: the tests run.
      - id: check
        continue-on-error: true
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          github.head_ref == 'dev' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The files main changed since its common ancestor with dev (no list, no skip).
          changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD...$BASE" \
            --jq '.files | if type == "array" then length else error("no file list") end')
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=dev&event=push&status=success&head_sha=$HEAD" --jq .total_count)
          echo "main changes $changed file(s) dev lacks; $passed passed CI run(s) on dev at $HEAD"
          if [ "$changed" = 0 ] && [ "$passed" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  # On a pull request into main (a deploy to production): the migrations it adds, in
  # the job summary. No deploy migrates Neon; a human runs db:migrate against it, and
  # must before this deploys, or the new code meets the old schema.
  migrations:
    name: New migrations
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List the migrations this pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" -- db/migrations/)
          {
            echo "## New migrations"
            if [ -n "$added" ]; then
              echo "Apply them to Neon (npm run db:migrate) before this deploys:"
              for file in $added; do echo "- $file"; done
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for file in $added; do
            echo "::warning file=$file::$file is new: migrate Neon before this deploys"
          done

  # On a pull request: the dependencies it adds or changes, against the advisory
  # database. It fails only on a vulnerability the pull request brings in, so one
  # already on the base branch (today's zod advisory) does not turn every run red.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4

  checks:
    name: Lint, type check, unit tests
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Every file Prettier checks (.prettierignore leaves out Markdown and the rest).
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npx prettier --check .
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx next typegen && npx tsc --noEmit
      # The unit tests run a Vitest project at a time (vitest.config.mts chooses each
      # project's files by folder and environment, so a new file needs no edit here),
      # each even if an earlier one failed: a failure is identifiable from the job's
      # step names alone. The database project runs in the build job, with a database.
      - name: Unit tests (dashboard)
        if: ${{ !cancelled() }}
        run: npx vitest run --project dashboard
      - name: Unit tests (cats, Node)
        if: ${{ !cancelled() }}
        run: npx vitest run --project cats
      - name: Unit tests (jsdom)
        if: ${{ !cancelled() }}
        run: npx vitest run --project jsdom
      # A test file in no group would never run: each unit test must be in exactly one
      # Vitest project, each browser test in one group of playwright.config.ts (GROUPS).
      - name: Every test file is in a group
        if: ${{ !cancelled() }}
        run: |
          missing=0
          node scripts/unit-projects.mjs || missing=1
          groups="$(sed -n '/^const GROUPS/,/^};/p' playwright.config.ts)"
          for file in tests/e2e/*.spec.ts; do
            name="$(basename "$file" .spec.ts)"
            found=$(grep -oF "'${name}'" <<< "$groups" | wc -l)
            if [ "$found" -ne 1 ]; then
              echo "::error file=$file::$file is in $found groups in playwright.config.ts (GROUPS), not 1"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build + browser tests (production)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and every library it needs come with the image, instead of a
    # `playwright install --with-deps` (an apt install) on every run. Its tag must
    # be the @playwright/test version in package-lock.json: the install step below
    # then finds the browser already there (if not, it downloads the right one).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # A throwaway PostgreSQL next to the job, like the AUTH_SECRET: it lives as
    # long as the job. scripts/ci-database.mjs turns TLS on (the app requires it)
    # and sets POSTGRES_URL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      AUTH_TRUST_HOST: 'true'
      # POSTGRES_URL is set by the "PostgreSQL" step. The browser tests derive and
      # rebuild their xenocats_test schema from it.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Throwaway AUTH_SECRET
        # Only signs sessions inside this run, so it need not be a repository secret.
        run: |
          secret="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - name: PostgreSQL
        run: node scripts/ci-database.mjs postgres xenocats
      - id: database
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - id: install
        # Already in the image: a no-op unless the versions drifted apart.
        run: npx playwright install chromium
      # Every browser test, in one run on one server: playwright.config.ts names the
      # groups (cat-attacks, smoke, customers, invoices, survival) as projects, so the
      # list and the report say which group a failure is in.
      - name: Browser tests against next start
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright test
        env:
          E2E_SERVER: start
      # Only this job has a database for them (the checks job skips this file),
      # whether or not the build and browser tests passed. The tests rebuild
      # their own schema, xenocats_vitest, on this job's server.
      # And they must have run: with DATABASE_TESTS or POSTGRES_URL lost, every test
      # would skip and the step pass. Vitest's JSON report says how many passed.
      - name: Database tests
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: |
          npx vitest run --project database --reporter=default --reporter=json --outputFile.json=vitest-data.json
          node scripts/ci-passed.mjs vitest-data.json "database test"
        env:
          DATABASE_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: Browser tests (dev server)
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and every library it needs come with the image, instead of a
    # `playwright install --with-deps` (an apt install) on every run. Its tag must
    # be the @playwright/test version in package-lock.json: the install step below
    # then finds the browser already there (if not, it downloads the right one).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # A throwaway PostgreSQL next to the job, like the AUTH_SECRET: it lives as
    # long as the job. scripts/ci-database.mjs turns TLS on (the app requires it)
    # and sets POSTGRES_URL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Throwaway AUTH_SECRET
        run: |
          secret="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - name: PostgreSQL
        run: node scripts/ci-database.mjs postgres xenocats
      - id: install
        # Already in the image: a no-op unless the versions drifted apart.
        run: npx playwright install chromium
      # The build job runs every browser test against the production server. This
      # one runs, against `next dev`, the specs for what differs there: the pages
      # boot and hydrate, the dev content security policy (next.config.ts) lets them
      # run, and the login works. Needs no db:migrate: the tests rebuild their own
      # xenocats_test schema.
      - name: Browser tests (smoke, security headers, dashboard login)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          # Only these specs: not the cat-attacks group the others wait for.
          E2E_NO_CAT_DEPS: '1'
        run: npx playwright test tests/e2e/smoke.spec tests/e2e/security-headers.spec tests/e2e/dashboard.spec
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

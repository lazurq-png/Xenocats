name: CI

# Only where work is merged: into Nightrun (an unattended run fast-forwards each
# finished task onto it and pushes it, then polls; or a pull request into it) and
# into main. A task branch's own push runs nothing: it was checked locally first.
on:
  push:
    branches: [Nightrun, main]
  pull_request:
    branches: [Nightrun, main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      # The unit tests run in named groups, each even if an earlier one failed,
      # so a failure is identifiable from the job's step names alone.
      - name: Unit tests (dashboard)
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run tests/unit/actions tests/unit/schemas tests/unit/utils
          tests/unit/auth-config tests/unit/dashboard tests/unit/proxy-matcher tests/unit/seed-data
          tests/unit/csv tests/unit/export-route tests/unit/invoice-status
          tests/unit/login-limit tests/unit/password-check tests/unit/credentials tests/unit/cat-error tests/unit/affected-tests
          tests/unit/forms
      - name: Unit tests (cats, Node)
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run tests/unit/xenocats/random tests/unit/xenocats/effects
          tests/unit/xenocats/cursor-controller tests/unit/xenocats/cat-engine tests/unit/xenocats/cat-engine-invariants
          tests/unit/xenocats/cat-types tests/unit/xenocats/intensity
      - name: Unit tests (cats, jsdom)
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run tests/unit/xenocats/cursor-kind tests/unit/xenocats/fake-cursor
          tests/unit/xenocats/cat-layer tests/unit/xenocats/cat-art tests/unit/xenocats/cat-sprite
          tests/unit/xenocats/movement-pad-view tests/unit/xenocats/game-settings
      - name: Unit tests (cats, games, page, sound)
        if: ${{ !cancelled() }}
        run: >-
          npx vitest run tests/unit/xenocats/arena tests/unit/xenocats/arsenal tests/unit/xenocats/varieties tests/unit/xenocats/progression tests/unit/xenocats/coop tests/unit/xenocats/test-hooks
          tests/unit/xenocats/walking
          tests/unit/xenocats/page-hits tests/unit/xenocats/sounds
          tests/unit/xenocats/field-guide tests/unit/xenocats/pet-cat tests/unit/xenocats/combos
          tests/unit/xenocats/puppets tests/unit/xenocats/movement-pad
      # A test file in no group would never run: each unit test must be named in a
      # group above, each browser test in a group of playwright.config.ts (GROUPS).
      - name: Every test file is in a group
        if: ${{ !cancelled() }}
        run: |
          missing=0
          for file in tests/unit/*.test.ts* tests/unit/xenocats/*.test.ts*; do
            name="${file%.test.ts*}"
            if ! grep -qE "(^|[[:space:]])${name}([[:space:]]|$)" .github/workflows/ci.yml; then
              echo "::error file=$file::$file is in no unit test group in ci.yml"
              missing=1
            fi
          done
          groups="$(sed -n '/^const GROUPS/,/^};/p' playwright.config.ts)"
          for file in tests/e2e/*.spec.ts; do
            name="$(basename "$file" .spec.ts)"
            found=$(grep -oF "'${name}'" <<< "$groups" | wc -l)
            if [ "$found" -ne 1 ]; then
              echo "::error file=$file::$file is in $found groups in playwright.config.ts (GROUPS), not 1"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build + browser tests (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and every library it needs come with the image, instead of a
    # `playwright install --with-deps` (an apt install) on every run. Its tag must
    # be the @playwright/test version in package-lock.json: the install step below
    # then finds the browser already there (if not, it downloads the right one).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # A throwaway PostgreSQL next to the job, like the AUTH_SECRET: it lives as
    # long as the job. scripts/ci-database.mjs turns TLS on (the app requires it)
    # and sets POSTGRES_URL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      AUTH_TRUST_HOST: 'true'
      # POSTGRES_URL is set by the "PostgreSQL" step. The browser tests derive and
      # rebuild their xenocats_test schema from it.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Throwaway AUTH_SECRET
        # Only signs sessions inside this run, so it need not be a repository secret.
        run: |
          secret="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - name: PostgreSQL
        run: node scripts/ci-database.mjs postgres xenocats
      - id: database
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - id: install
        # Already in the image: a no-op unless the versions drifted apart.
        run: npx playwright install chromium
      # Every browser test, in one run on one server: playwright.config.ts names the
      # groups (cat-attacks, smoke, customers, invoices, survival) as projects, so the
      # list and the report say which group a failure is in.
      - name: Browser tests against next start
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright test
        env:
          E2E_SERVER: start
      # Only this job has a database for them (the checks job skips this file),
      # whether or not the build and browser tests passed. The tests rebuild
      # their own schema, xenocats_vitest, on this job's server.
      - name: Database tests
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: npx vitest run tests/unit/data
        env:
          DATABASE_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: Browser tests (dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium and every library it needs come with the image, instead of a
    # `playwright install --with-deps` (an apt install) on every run. Its tag must
    # be the @playwright/test version in package-lock.json: the install step below
    # then finds the browser already there (if not, it downloads the right one).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # A throwaway PostgreSQL next to the job, like the AUTH_SECRET: it lives as
    # long as the job. scripts/ci-database.mjs turns TLS on (the app requires it)
    # and sets POSTGRES_URL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Throwaway AUTH_SECRET
        run: |
          secret="$(node -p "require('node:crypto').randomBytes(32).toString('base64')")"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm ci
      - name: PostgreSQL
        run: node scripts/ci-database.mjs postgres xenocats
      - id: install
        # Already in the image: a no-op unless the versions drifted apart.
        run: npx playwright install chromium
      # The build job runs every browser test against the production server. This
      # one runs, against `next dev`, the specs for what differs there: the pages
      # boot and hydrate, the dev content security policy (next.config.ts) lets them
      # run, and the login works. Needs no db:migrate: the tests rebuild their own
      # xenocats_test schema.
      - name: Browser tests (smoke, security headers, dashboard login)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          # Only these specs: not the cat-attacks group the others wait for.
          E2E_NO_CAT_DEPS: '1'
        run: npx playwright test tests/e2e/smoke.spec tests/e2e/security-headers.spec tests/e2e/dashboard.spec
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
